name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  # Publishing is gated on the full lint + test matrix passing.
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      # NOTE: consider switching to PyPI trusted publishing (OIDC) —
      # pypa/gh-action-pypi-publish with `permissions: id-token: write` —
      # to retire the long-lived PYPI_TOKEN secret. Requires configuring
      # the publisher on pypi.org first.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
