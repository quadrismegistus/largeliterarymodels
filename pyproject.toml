[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "largeliterarymodels"
version = "0.6.1"
description = "LLMs for digital humanities: structured data extraction from unstructured texts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
    {name = "Ryan Heuser"},
]
keywords = ["llm", "digital-humanities", "nlp", "structured-data", "pydantic", "anthropic", "openai", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/quadrismegistus/largeliterarymodels"
Repository = "https://github.com/quadrismegistus/largeliterarymodels"
Issues = "https://github.com/quadrismegistus/largeliterarymodels/issues"

[project.scripts]
litmod = "largeliterarymodels.cli.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
lltk = ["lltk-dh"]
annotate = ["fh-pydantic-form>=0.3", "uvicorn"]
analysis = [
    "scipy>=1.9",
    "numpy",
    "pandas",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["largeliterarymodels*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: prompt/docstring lines routinely exceed the limit by design.
# E402: several modules do lazy/deferred imports after module doctext.
# E701: compact single-line guards are house style.
# E712: pandas element-wise `== True` comparisons are intentional.
# B905: zip(strict=) not adopted (py3.10+ compat style).
ignore = ["E501", "E402", "E701", "E712", "B905"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-exports are the public API, not unused imports.
"largeliterarymodels/__init__.py" = ["F401"]
"largeliterarymodels/tasks/__init__.py" = ["F401"]
# Notebook-support and prototype scripts are exploratory
"scripts/*" = ["E", "F", "W", "B"]
